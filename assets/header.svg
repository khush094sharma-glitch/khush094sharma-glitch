<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="Animated neural orbit header for Khushboo Sharma, Data Scientist">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#05060F"/>
      <stop offset="35%" stop-color="#1E1B4B"/>
      <stop offset="65%" stop-color="#4C1D95"/>
      <stop offset="100%" stop-color="#083344"/>
    </linearGradient>

    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#A855F7"/>
      <stop offset="50%" stop-color="#22D3EE"/>
      <stop offset="100%" stop-color="#C084FC"/>
    </linearGradient>

    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#A855F7" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#05060F" stop-opacity="0"/>
    </radialGradient>

    <filter id="soft">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>

  <rect width="1200" height="320" fill="url(#bg)"/>
  <circle cx="600" cy="160" r="190" fill="url(#glow)" filter="url(#soft)"/>

  <g opacity="0.55">
    <circle cx="180" cy="70" r="2" fill="#E9D5FF">
      <animate attributeName="opacity" values="0.15;1;0.15" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1010" cy="250" r="2" fill="#67E8F9">
      <animate attributeName="opacity" values="1;0.15;1" dur="4.1s" repeatCount="indefinite"/>
    </circle>
    <circle cx="930" cy="60" r="1.7" fill="#C4B5FD">
      <animate attributeName="opacity" values="0.2;0.9;0.2" dur="2.7s" repeatCount="indefinite"/>
    </circle>
    <circle cx="250" cy="250" r="1.7" fill="#A5F3FC">
      <animate attributeName="opacity" values="0.8;0.15;0.8" dur="3.8s" repeatCount="indefinite"/>
    </circle>
  </g>

  <g transform="translate(600 160)">
    <circle r="118" fill="none" stroke="url(#ring)" stroke-width="1.5" opacity="0.55"/>
    <circle r="86" fill="none" stroke="#7DD3FC" stroke-width="0.8" opacity="0.28"/>

    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="18s" repeatCount="indefinite"/>
      <circle cx="118" cy="0" r="6" fill="#A855F7"/>
      <circle cx="-118" cy="0" r="4" fill="#22D3EE"/>
      <circle cx="0" cy="-118" r="5" fill="#C084FC"/>
    </g>

    <g>
      <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="26s" repeatCount="indefinite"/>
      <circle cx="86" cy="0" r="3.5" fill="#67E8F9"/>
      <circle cx="-86" cy="0" r="3" fill="#E9D5FF"/>
      <circle cx="0" cy="86" r="4.5" fill="#A855F7"/>
    </g>

    <circle r="34" fill="#0B0B16" stroke="url(#ring)" stroke-width="2"/>
    <text x="0" y="7" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="20" font-weight="700" fill="#F8FAFC">KS</text>
  </g>

  <text x="600" y="150" text-anchor="middle" font-family="Inter, Segoe UI, sans-serif" font-size="54" font-weight="800" letter-spacing="6" fill="#F8FAFC">KHUSHBOO SHARMA</text>
  <text x="600" y="192" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="18" letter-spacing="7" fill="#C4B5FD">DATA SCIENTIST</text>

  <g>
    <animate attributeName="opacity" values="0.35;1;0.35" dur="4.5s" repeatCount="indefinite"/>
    <rect x="430" y="228" width="340" height="1.5" fill="url(#ring)"/>
  </g>
</svg>
